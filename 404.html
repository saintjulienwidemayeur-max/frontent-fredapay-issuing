<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable : Freda Pay Issuing</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" type="image/png" href="/favicon-96.png" sizes="96x96">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="robots" content="noindex, follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#111111; --gold:#ff4081; --gold-soft:rgba(255,64,129,.08);
    --muted:#666666; --line:#e5e5e5; --bg-soft:#f6f6f6;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Arial,sans-serif;color:var(--ink);background:#fff;min-height:100vh;display:flex;flex-direction:column}
  a{color:inherit;text-decoration:none}

  header{padding:22px 0}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  .logo{display:flex;align-items:center;gap:10px;width:fit-content}
  .logo .mark{width:34px;height:34px;border-radius:9px;overflow:hidden;background:var(--gold)}
  .logo .mark img{width:100%;height:100%;object-fit:cover;display:block}
  .logo .brand-text{font-weight:800;font-size:1.05rem}
  .logo .brand-issuing{color:var(--gold);font-weight:800;margin-left:4px}

  main{flex:1;display:flex;align-items:center;justify-content:center;padding:40px 24px}
  .content{text-align:center;max-width:480px}
  .code{font-size:6rem;font-weight:900;letter-spacing:-.03em;background:linear-gradient(135deg,var(--gold),#ff8fb3);-webkit-background-clip:text;background-clip:text;color:transparent;line-height:1}
  h1{font-size:1.5rem;margin:14px 0 10px}
  p{color:var(--muted);font-size:.96rem;margin-bottom:30px;line-height:1.6}
  .actions{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
  .btn{display:inline-flex;align-items:center;gap:8px;padding:13px 24px;border-radius:11px;font-weight:700;font-size:.9rem;cursor:pointer;transition:.2s}
  .btn-primary{background:var(--ink);color:#fff}
  .btn-primary:hover{background:#2a2a2a}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--ink)}
  .btn-ghost:hover{background:var(--bg-soft)}

  footer{padding:26px 0;text-align:center;font-size:.8rem;color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="wrap">
    <a href="/" class="logo">
      <span class="mark"><img src="/logo-64.png" alt="Freda Pay Issuing" width="32" height="32"></span>
      <span class="brand-text">FREDA PAY <span class="brand-issuing">ISSUING</span></span>
    </a>
  </div>
</header>

<main>
  <div class="content">
    <div class="code">404</div>
    <h1>Cette page n'existe pas</h1>
    <p>La page que vous cherchez a été déplacée, supprimée, ou l'adresse est incorrecte.</p>
    <div class="actions">
      <a href="/" class="btn btn-primary">Retour à l'accueil</a>
      <a href="mailto:issuing@fredapay.com" class="btn btn-ghost">Contacter le support</a>
    </div>
  </div>
</main>

<footer>
  © <span id="year"></span> Freda Pay LLC
</footer>

<script>document.getElementById('year').textContent = new Date().getFullYear();</script>
</body>
</html>
